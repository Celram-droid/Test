<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17132f">
<title>Quizabend</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f4ff;background:#121026}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#39316c,#121026 72%);padding:18px 18px 92px}main{max-width:920px;margin:auto}h2,h3{margin-top:0}section{background:#262141;border:1px solid #635981;border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 15px 35px #08061355}p{line-height:1.5;color:#ded9ed}.muted{color:#bdb5d2;font-size:.92rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:12px}label{font-weight:650;display:grid;gap:6px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:12px;color:#fff;background:#393354;border:1px solid #8c81ac;border-radius:10px}textarea{resize:vertical;min-height:96px}button{border:0;border-radius:11px;background:#d8bcff;color:#221936;padding:12px 17px;font-weight:780;cursor:pointer}button:hover{background:#ead9ff}button:disabled{opacity:.46;cursor:default}.secondary{background:#504776;color:white}.danger{background:#9c4259;color:white}.hidden{display:none!important}.box{padding:14px;background:#342d51;border-radius:12px;margin:10px 0}.code{font-size:2rem;font-weight:850;letter-spacing:.12em;color:#e6cdff}.notice{padding:12px;border-radius:10px;background:#314c44;color:#e6fff0}.error{background:#673348;color:#fff}.warn{background:#695528;color:#fff4d0}a{color:#dbbdff}hr{border:0;border-top:1px solid #5c5279;margin:22px 0}.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.category-grid button{min-height:78px;font-size:1.05rem;border:2px solid transparent;box-shadow:0 8px 20px #08061335;transition:transform .12s ease,filter .12s ease}.category-grid button:hover{transform:translateY(-2px);filter:brightness(1.08)}.category-wissen{background:#b8dcff;color:#15233a;border-color:#d9ecff!important}.category-duell{background:#ffc0c9;color:#421a22;border-color:#ffe0e5!important}.category-trinken{background:#bdebd0;color:#173524;border-color:#ddf8e8!important}.category-regel{background:#ffe0a6;color:#3f2b08;border-color:#fff0cf!important}.category-rolle{background:#dec8ff;color:#2c1849;border-color:#efe3ff!important}.category-ereignis{background:#c9d0ff;color:#1b2350;border-color:#e3e7ff!important}.player-card{padding:10px 12px 10px 14px;background:#342d51;border-radius:12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.player-card span{min-width:0}.kick-btn{flex:0 0 auto;padding:7px 11px;min-width:38px;font-size:1rem;line-height:1}.content-card{padding:24px;border-radius:18px;margin:16px 0;border:2px solid #8c81ac;box-shadow:0 12px 28px #08061355}.content-card h2{font-size:1.65rem;margin-bottom:8px}.content-card .big{font-size:1.18rem;color:#fff}.card-wissen{background:#203c59;border-color:#83bff1}.card-duell{background:#572b36;border-color:#e58fa0}.card-trinken{background:#204938;border-color:#7bd0a1}.card-regel{background:#58451f;border-color:#ddb65f}.card-rolle{background:#44305d;border-color:#bd91ee}.card-ereignis{background:#30375f;border-color:#929de9}.answer-box{padding:16px 18px;border-radius:12px;background:#263f35;border:2px solid #70c899;color:#edfff5;font-weight:800;font-size:1.08rem;margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.full{width:100%}.lobby-panel{border:2px solid #776d98;background:#1d1937;box-shadow:0 12px 30px #08061355}.lobby-panel h2{margin-bottom:16px}.invite-grid{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}.qr-box{display:grid;justify-items:center;gap:8px;padding:14px;background:#342d51;border-radius:14px}.qr-code{background:#fff;padding:10px;border-radius:12px;line-height:0}.qr-code svg{width:min(190px,52vw);height:auto}.qr-hint{margin:0;text-align:center;font-size:.86rem}.lobby-divider{border:0;border-top:2px solid #5c5279;margin:18px 0}.lobby-buttons{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}.bottom-nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;display:grid;grid-template-columns:1fr 1fr;gap:6px;width:min(330px,calc(100vw - 24px));padding:6px;background:#17132feF;border:1px solid #665d86;border-radius:16px;box-shadow:0 10px 30px #06040f99;backdrop-filter:blur(10px)}.bottom-nav button{padding:9px 12px;border-radius:11px;background:transparent;color:#c9c2dc;font-size:.88rem;font-weight:750}.bottom-nav button:hover{background:#312b4d}.bottom-nav button.active{background:#d8bcff;color:#241a39}.bottom-nav button:disabled{opacity:.35}.game-players-panel,.game-rules-panel{margin-top:18px;border:1px solid #51496f;background:#1d1937}.game-players-panel h3,.game-rules-panel h3{margin-bottom:10px}.game-player-card{padding:9px 12px;background:#342d51;border-radius:11px;margin:7px 0}.active-rule-card{padding:9px 10px 9px 12px;background:#342d51;border-radius:11px;margin:7px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}.info-link{border:0;background:transparent;color:#efe9ff;padding:2px 4px;text-align:left;font-weight:750;cursor:pointer}.info-link:hover{background:transparent;color:#fff;text-decoration:underline}.rule-remove-btn{flex:0 0 auto;padding:6px 10px;min-width:36px}.role-inline{display:inline;border:0;background:transparent;color:#e6cdff;padding:0;font-weight:800;cursor:pointer}.role-inline:hover{background:transparent;text-decoration:underline}.custom-rule-editor{display:grid;gap:12px;margin:12px 0;padding:14px;background:#211c3b;border:1px solid #7f6936;border-radius:12px}.custom-rule-editor button{justify-self:start}.event-actions{margin:12px 0;padding:14px;background:#211c3b;border:1px solid #5d547b;border-radius:12px}.event-actions label{margin-top:8px}.event-actions select{width:100%;padding:11px;color:#fff;background:#393354;border:1px solid #8c81ac;border-radius:10px}.event-actions button{margin-top:10px}.info-dialog{border:0;padding:0;background:transparent;color:#fff;max-width:min(520px,calc(100vw - 28px));width:100%}.info-dialog::backdrop{background:#06040fbb;backdrop-filter:blur(3px)}.info-dialog-card{position:relative;background:#262141;border:1px solid #766b99;border-radius:18px;padding:22px;box-shadow:0 20px 60px #05030dcc}.info-dialog-card h2{margin:4px 38px 8px 0}.info-dialog-card p{margin-bottom:0}.dialog-close{position:absolute;right:12px;top:12px;padding:6px 10px;background:#504776;color:#fff}.view-panel{min-height:1px}@media(min-width:640px){.lobby-buttons{grid-template-columns:1fr 1fr}.invite-grid{grid-template-columns:minmax(0,1fr) auto}}@media(min-width:720px){.category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){body{padding:10px 10px 86px}section{padding:16px}.actions button{flex:1 1 100%}.bottom-nav{bottom:8px}}
.duel-timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0;padding:14px;background:#211c3b;border:1px solid #8b789d;border-radius:12px}.timer-display{font-size:1.9rem;font-weight:900;letter-spacing:.06em;min-width:108px}.timer-finished{color:#ffd1d9}.knowledge-response{display:grid;gap:12px;margin:14px 0;padding:14px;background:#1d2f48;border:1px solid #6c9fc9;border-radius:12px}.knowledge-results{display:grid;gap:7px}.knowledge-results h3{margin:0 0 4px}.knowledge-answer-row{padding:10px 12px;background:#274663;border-radius:10px;font-weight:750}.rule-replacement{display:grid;gap:12px;margin:12px 0;padding:14px;background:#211c3b;border:1px solid #b99752;border-radius:12px}.rule-replacement select{width:100%;padding:11px;color:#fff;background:#393354;border:1px solid #8c81ac;border-radius:10px}
</style>
</head>
<body><main>
<div id="message" class="hidden" role="status"></div>

<section id="home">
  <h2>Spiel erstellen oder beitreten</h2>
  <label>Dein Name<input id="playerName" maxlength="24" autocomplete="nickname" placeholder="z. B. Alexa"></label>
  <div class="grid" style="margin-top:14px">
    <div class="box"><h3>Neue Lobby</h3><p class="muted">Erstelle einen Spielcode und lade die anderen ein.</p><button id="createRoomBtn">Neues Spiel erstellen</button></div>
    <div class="box"><h3>Lobby beitreten</h3><label>Spielcode<input id="joinCode" maxlength="8" autocapitalize="characters" placeholder="z. B. ABCD2345"></label><button id="joinBtn" style="margin-top:10px">Beitreten</button></div>
  </div>
</section>

<div id="room" class="hidden">
  <div id="gameView" class="view-panel hidden">
    <section id="gameArea" class="hidden">
      <div id="categoryArea"></div>
      <div id="currentArea"></div>
    </section>
    <section id="activeRulesPanel" class="game-rules-panel hidden">
      <h3>Aktive Regeln</h3>
      <div id="activeRuleList"></div>
    </section>
    <section id="gamePlayersPanel" class="game-players-panel hidden">
      <h3>Mitspieler</h3>
      <div id="gamePlayerList"></div>
    </section>
  </div>

  <div id="settingsView" class="view-panel hidden">
    <section class="lobby-panel">
      <h2>Einstellungen</h2>
      <div class="invite-grid">
        <div>
          <div class="muted">Spielcode</div><div class="code" id="roomCode"></div>
          <p id="inviteWrap">Beitrittslink: <a id="inviteLink" target="_blank" rel="noopener"></a></p>
        </div>
        <div class="qr-box">
          <div class="muted">QR-Code zum Beitreten</div>
          <div id="qrCode" class="qr-code"></div>
          <p class="muted qr-hint">Scannen, Namen eingeben und beitreten.</p>
        </div>
      </div>
      <hr class="lobby-divider">
      <h3>Mitspieler</h3>
      <div id="playerList"></div>
      <div id="lobbyActions"></div>
      <hr class="lobby-divider">
      <div class="lobby-buttons">
        <button id="leaveLobbyBtn" class="secondary">Lobby verlassen</button>
        <button id="endLobbyBtn" class="danger">Lobby für alle beenden</button>
      </div>
    </section>
  </div>

  <nav id="viewNav" class="bottom-nav" aria-label="Ansicht wechseln">
    <button id="gameTabBtn" type="button">🎮 Spiel</button>
    <button id="settingsTabBtn" type="button">⚙️ Einstellungen</button>
  </nav>
</div>

<dialog id="infoDialog" class="info-dialog">
  <div class="info-dialog-card">
    <button id="infoDialogClose" class="dialog-close" type="button" aria-label="Schließen">✕</button>
    <div id="infoDialogKicker" class="muted"></div>
    <h2 id="infoDialogTitle"></h2>
    <p id="infoDialogText"></p>
  </div>
</dialog>
</main>
<script src="./qr-local.js?v=12.4"></script>
<script type="module" src="./app.js?v=12.4"></script></body>
</html>
