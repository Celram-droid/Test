<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quizabend – Probeversion</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #f7f4ff; background: #121026; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top left, #38306b, #121026 70%); }
    main { width: min(100%, 680px); background: #24203f; border: 1px solid #59517b; border-radius: 24px; padding: clamp(22px, 5vw, 42px); box-shadow: 0 24px 70px #08061488; }
    .eyebrow { color: #c7b6ff; font-size: .85rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
    h1 { margin: .3em 0 .15em; font-size: clamp(2rem, 6vw, 3rem); }
    p { color: #ded9ed; line-height: 1.5; }
    label { display: block; margin: 25px 0 8px; font-weight: 700; }
    select, button { font: inherit; }
    select { width: 100%; padding: 13px; color: #fff; background: #353054; border: 1px solid #8176aa; border-radius: 10px; }
    .topline { display: flex; justify-content: space-between; gap: 12px; margin: 28px 0 12px; color: #c7b6ff; font-weight: 700; }
    h2 { font-size: 1.35rem; line-height: 1.4; min-height: 3em; }
    .answers { display: grid; gap: 10px; }
    .answer { display: block; width: 100%; text-align: left; padding: 15px 17px; border-radius: 12px; border: 1px solid #746a99; background: #353052; color: white; cursor: pointer; }
    .answer:hover:not(:disabled), .answer:focus-visible { background: #504675; outline: 2px solid #d3baff; }
    .answer:disabled { cursor: default; }
    .answer.correct { background: #175c48; border-color: #68e3ac; }
    .answer.wrong { background: #713044; border-color: #ff9cae; }
    #feedback { min-height: 2em; font-weight: 700; color: #fff; }
    #next { width: 100%; padding: 14px 18px; border: 0; border-radius: 12px; background: #d9beff; color: #231a3d; font-weight: 800; cursor: pointer; }
    #next:hover { background: #ead9ff; }
    #next:disabled { opacity: .45; cursor: default; }
    small { display: block; margin-top: 20px; color: #bcb4d0; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Probewebseite</div>
    <h1>Quizabend ✨</h1>
    <p>Wähle einen Fragenpool und tippe auf eine Antwort. Du siehst sofort, ob sie richtig ist.</p>
    <label for="pool">Fragenpool</label>
    <select id="pool">
      <option value="1">Pool 1 · Karten 2–8</option>
      <option value="2">Pool 2 · Karten 9–Dame</option>
      <option value="3">Pool 3 · König & Ass</option>
    </select>
    <div class="topline"><span id="category"></span><span id="score">0 richtig · 0 beantwortet</span></div>
    <h2 id="question"></h2>
    <div id="answers" class="answers"></div>
    <p id="feedback" role="status" aria-live="polite"></p>
    <button id="next" disabled>Nächste Frage →</button>
    <small>Testfragen: Hier können später eure eigenen Fragen aus den drei Pools hinein.</small>
  </main>
  <script>
    // Eigene Fragen hier ergänzen: Die Zahl bei answer ist die Position der richtigen Antwort (0 = erste).
    const questions = {
      1: [
        { question: "Welcher Planet ist der Sonne am nächsten?", options: ["Venus", "Merkur", "Mars", "Erde"], answer: 1 },
        { question: "Wie viele Minuten hat eine Stunde?", options: ["30", "45", "60", "90"], answer: 2 },
        { question: "Welche Farbe entsteht aus Blau und Gelb?", options: ["Grün", "Orange", "Lila", "Rot"], answer: 0 }
      ],
      2: [
        { question: "Was ist das chemische Symbol für Gold?", options: ["Ag", "Au", "Gd", "Go"], answer: 1 },
        { question: "Welcher Ozean ist der größte?", options: ["Atlantik", "Indischer Ozean", "Pazifik", "Arktischer Ozean"], answer: 2 },
        { question: "Wie viele Seiten hat ein Hexagon?", options: ["5", "6", "7", "8"], answer: 1 }
      ],
      3: [
        { question: "Welches Element hat die Ordnungszahl 1?", options: ["Helium", "Sauerstoff", "Wasserstoff", "Kohlenstoff"], answer: 2 },
        { question: "In welchem Jahr fiel die Berliner Mauer?", options: ["1987", "1989", "1991", "1993"], answer: 1 },
        { question: "Wie heißt die Hauptstadt von Kanada?", options: ["Toronto", "Vancouver", "Montreal", "Ottawa"], answer: 3 }
      ]
    };

    const pool = document.querySelector("#pool");
    const questionEl = document.querySelector("#question");
    const answersEl = document.querySelector("#answers");
    const feedback = document.querySelector("#feedback");
    const next = document.querySelector("#next");
    let remaining = [], current, correct = 0, answered = 0;

    function resetPool() {
      remaining = questions[pool.value].map((_, index) => index);
      correct = answered = 0;
      showQuestion();
    }
    function showQuestion() {
      if (remaining.length === 0) remaining = questions[pool.value].map((_, index) => index);
      const randomIndex = Math.floor(Math.random() * remaining.length);
      current = questions[pool.value][remaining.splice(randomIndex, 1)[0]];
      document.querySelector("#category").textContent = `Fragenpool ${pool.value}`;
      document.querySelector("#score").textContent = `${correct} richtig · ${answered} beantwortet`;
      questionEl.textContent = current.question;
      feedback.textContent = "";
      next.disabled = true;
      answersEl.replaceChildren();
      current.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.textContent = option;
        button.addEventListener("click", () => checkAnswer(index));
        answersEl.append(button);
      });
    }
    function checkAnswer(index) {
      if (!next.disabled) return;
      answered++;
      const isCorrect = index === current.answer;
      if (isCorrect) correct++;
      [...answersEl.children].forEach((button, i) => {
        button.disabled = true;
        if (i === current.answer) button.classList.add("correct");
        if (i === index && !isCorrect) button.classList.add("wrong");
      });
      feedback.textContent = isCorrect ? "✅ Richtig!" : `❌ Leider falsch. Richtig ist: ${current.options[current.answer]}.`;
      document.querySelector("#score").textContent = `${correct} richtig · ${answered} beantwortet`;
      next.disabled = false;
    }
    pool.addEventListener("change", resetPool);
    next.addEventListener("click", showQuestion);
    resetPool();
  </script>
</body>
</html>
